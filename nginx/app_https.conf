# Plain HTTP: serve ACME challenges for cert issuance/renewal,
# redirect everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name turkmenistan-kultur.at www.turkmenistan-kultur.at.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name turkmenistan-kultur.at www.turkmenistan-kultur.at.com;

    ssl_certificate /etc/letsencrypt/live/custom/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/custom/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    location ~* \.(?:css|js|svg|webp|ttf|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
